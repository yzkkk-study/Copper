<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铜 · 数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
<style>
:root{
  color-scheme:light;
  --canvas:#f2f3f5;
  --surface:#ffffff;
  --surface-muted:#f8f9fa;
  --surface-dark:#111214;
  --surface-dark-raised:#191a1b;
  --ink:#17181a;
  --ink-muted:#62666d;
  --ink-on-dark:#f7f8f8;
  --line:#e1e3e6;
  --line-dark:#2a2c30;
  --accent:#b44932;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box;letter-spacing:0}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif}
button{border:0;background:none;color:inherit;font:inherit;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.topbar{display:flex;min-height:54px;background:var(--surface-dark);border-bottom:1px solid var(--line-dark)}
.header{display:flex;align-items:center;gap:10px;min-width:208px;padding:0 18px;color:var(--ink-on-dark);font-size:16px;font-weight:600;white-space:nowrap}
.brand-mark{width:4px;height:22px;border-radius:2px;background:var(--accent)}
.nav{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-item{position:relative;display:flex;align-items:center;min-width:68px;min-height:53px;padding:0 18px;cursor:pointer;color:#9fa4ad;font-size:14px;font-weight:500;justify-content:center;white-space:nowrap}
.nav-item:hover{color:var(--ink-on-dark);background:var(--surface-dark-raised)}
.nav-item.active{color:var(--ink-on-dark);background:var(--surface-dark-raised)}
.nav-item.active::after{content:'';position:absolute;right:14px;bottom:0;left:14px;height:2px;background:var(--accent)}
.sub-nav{display:flex;align-items:center;gap:4px;min-height:42px;padding:5px 18px;overflow-x:auto;background:var(--surface-muted);border-bottom:1px solid var(--line);scrollbar-width:none}
.sub-nav::-webkit-scrollbar{display:none}
.sub-item{min-height:32px;padding:6px 12px;cursor:pointer;color:var(--ink-muted);font-size:13px;font-weight:500;border:1px solid transparent;border-radius:var(--radius);white-space:nowrap;text-align:center}
.sub-item:hover{color:var(--ink);background:#eef0f2}
.sub-item.active{color:var(--ink);background:var(--surface);border-color:var(--line)}
.main{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:208px;min-width:208px;padding:10px 8px;overflow-y:auto;background:var(--surface-muted);border-right:1px solid var(--line)}
.side-item{display:block;width:100%;min-height:38px;padding:9px 12px;cursor:pointer;color:var(--ink-muted);font-size:13px;border:1px solid transparent;border-radius:var(--radius)}
.side-item:hover{color:var(--ink);background:#eef0f2}
.side-item.active{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 var(--accent)}
.content{flex:1;min-width:0;overflow:hidden;padding:12px}
.chart-wrap{width:100%;height:100%;min-width:0;min-height:0}
.chart-grid{overflow-y:auto;overflow-x:hidden;scrollbar-color:#c5c8ce transparent;scrollbar-width:thin}
.chart-cell{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(17,18,20,.04)}
.data-table-shell{display:flex;flex-direction:column;width:100%;height:100%;min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.data-table-meta{display:flex;align-items:center;flex:0 0 42px;min-width:0;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface-muted)}
.data-table-year{font-size:13px;font-weight:600;color:var(--ink)}
.data-table-source{margin-left:auto;font-size:10px;color:var(--ink-muted);white-space:nowrap}
.data-table-scroll{flex:1;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c5c8ce var(--surface-muted)}
.data-table-scroll.is-draggable{cursor:grab}
.data-table-scroll.is-dragging{cursor:grabbing;user-select:none}
.data-table-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.monthly-balance-table{width:max(100%,1516px);border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--surface)}
.monthly-balance-table col.metric-col{width:220px}
.monthly-balance-table col.month-col{width:108px}
.monthly-balance-table thead th{position:sticky;top:0;z-index:3;height:44px;padding:0 12px;background:var(--surface-dark);color:var(--ink-on-dark);border-right:1px solid #42454b;border-bottom:1px solid #42454b;font-size:11px;font-weight:600;text-align:center;white-space:nowrap}
.monthly-balance-table thead th:first-child{left:0;z-index:5;text-align:left}
.monthly-balance-table tbody th,.monthly-balance-table tbody td{height:46px;padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;line-height:1.35}
.monthly-balance-table tbody th{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;font-weight:400}
.monthly-balance-table tbody td{text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.monthly-balance-table tbody tr:hover th,.monthly-balance-table tbody tr:hover td{background:var(--surface-muted)}
.metric-main{display:block;color:var(--ink);font-size:12px;font-weight:600}
.metric-unit{display:block;margin-top:2px;color:var(--ink-muted);font-size:9px;font-weight:400}
.balance-empty{color:#b2b6bd}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
@media (max-width:720px){
  .topbar{min-height:48px}
  .header{min-width:144px;padding:0 12px;font-size:14px}
  .brand-mark{height:18px}
  .nav-item{min-width:58px;min-height:47px;padding:0 12px;font-size:13px}
  .sub-nav{min-height:40px;padding:4px 8px}
  .main{flex-direction:column}
  .sidebar{display:flex;width:100%;min-width:0;min-height:48px;padding:5px 8px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  .side-item{width:auto;min-width:max-content;min-height:38px;padding:9px 12px;text-align:center}
  .side-item.active{box-shadow:inset 0 -3px var(--accent)}
  .content{padding:8px}
  .data-table-meta{flex-basis:40px;padding:0 10px}
  .monthly-balance-table{width:1400px}
  .monthly-balance-table col.metric-col{width:184px}
  .monthly-balance-table col.month-col{width:100px}
  .monthly-balance-table thead th,.monthly-balance-table tbody th,.monthly-balance-table tbody td{padding-left:9px;padding-right:9px}
}
</style>
</head>
<body>
<header class="topbar">
  <h1 class="header"><span class="brand-mark" aria-hidden="true"></span>铜 · 数据看板</h1>
  <nav class="nav" id="navBar" aria-label="主模块"></nav>
</header>
<nav class="sub-nav" id="subNav" aria-label="子模块"></nav>
<div class="main">
  <aside class="sidebar" id="sidebar" aria-label="图表组"></aside>
  <div class="content" id="contentWrap"><div class="chart-wrap" id="chartWrap"></div></div>
</div>
<script>
const chartData = {};
const MODULES = [{"id": "supply", "name": "供应", "subs": [{"name": "铜矿", "groups": [{"id": "S-ORE-01", "name": "ICSG全球铜矿产量", "type": "seasonal_grid"}, {"id": "S-ORE-02", "name": "智利秘鲁铜矿产量", "type": "seasonal_grid"}, {"id": "S-ORE-06", "name": "铜矿供应增速", "type": "mixed_grid"}, {"id": "S-ORE-03", "name": "铜矿出港", "type": "seasonal_grid"}, {"id": "S-ORE-04", "name": "港口库存", "type": "seasonal"}, {"id": "S-ORE-05", "name": "进口TC", "type": "line"}]}, {"name": "废铜", "groups": [{"id": "S-SCRAP-01", "name": "精废价差与票点", "type": "line_grid"}, {"id": "S-SCRAP-02", "name": "废铜成交", "type": "line_grid"}, {"id": "S-SCRAP-03", "name": "阳极板", "type": "mixed_grid"}, {"id": "S-SCRAP-04", "name": "海外废铜价格", "type": "line"}]}, {"name": "精炼铜", "groups": [{"id": "S-REFINED-01", "name": "精炼铜产量", "type": "seasonal_grid"}, {"id": "S-REFINED-04", "name": "铜冶炼检修", "type": "seasonal"}, {"id": "S-REFINED-02", "name": "冶炼利润", "type": "line_grid"}, {"id": "S-REFINED-03", "name": "ICSG精炼铜产量", "type": "seasonal_grid"}]}]}, {"id": "downstream", "name": "下游", "subs": [{"name": "下游高频", "groups": [{"id": "D-HF-01", "name": "成交量", "type": "seasonal_grid"}, {"id": "D-HF-02", "name": "加工费", "type": "mixed_grid"}, {"id": "D-HF-03", "name": "周度开工", "type": "seasonal_grid"}, {"id": "D-HF-04", "name": "铜杆社会库存", "type": "seasonal"}]}, {"name": "铜材月度", "groups": [{"id": "D-MONTHLY-01", "name": "铜材开工率", "type": "seasonal_grid"}, {"id": "D-MONTHLY-02", "name": "消费商电解铜库存", "type": "seasonal"}, {"id": "D-MONTHLY-03", "name": "原料库存天数", "type": "seasonal_grid"}, {"id": "D-MONTHLY-04", "name": "成品库存天数", "type": "seasonal_grid"}, {"id": "D-MONTHLY-05", "name": "铜材用铜量", "type": "seasonal_grid"}]}, {"name": "终端表现", "groups": [{"id": "D-END-01", "name": "线缆和漆包线", "type": "seasonal_grid"}, {"id": "D-END-02", "name": "电源电网投资额", "type": "mixed_grid"}, {"id": "D-END-05", "name": "国网南网债券发行", "type": "mixed_grid"}, {"id": "D-END-03", "name": "风电光伏装机", "type": "mixed_grid"}, {"id": "D-END-04", "name": "空调数据", "type": "mixed_grid"}]}]}, {"id": "inventory", "name": "库存", "subs": [{"name": "国内", "groups": [{"id": "I-DOM-01", "name": "钢联库存", "type": "seasonal_grid"}, {"id": "I-DOM-02", "name": "SMM库存", "type": "seasonal_grid"}, {"id": "I-DOM-03", "name": "冶炼厂库存月度", "type": "seasonal_grid"}, {"id": "I-DOM-04", "name": "国内铜表需", "type": "seasonal_grid"}, {"id": "I-DOM-05", "name": "国内月度平衡表", "type": "data_table"}]}, {"name": "LME", "groups": [{"id": "I-LME-01", "name": "LME-on库存", "type": "seasonal_grid"}, {"id": "I-LME-02", "name": "LME-off库存", "type": "seasonal_grid"}, {"id": "I-LME-03", "name": "LME on+off库存", "type": "seasonal"}, {"id": "I-LME-04", "name": "注册仓单结构", "type": "seasonal_grid"}, {"id": "I-LME-05", "name": "注销仓单结构", "type": "seasonal_grid"}]}, {"name": "分地区库存", "groups": [{"id": "I-REG-01", "name": "全球库存分布", "type": "seasonal_grid"}, {"id": "I-REG-02", "name": "美国铜库存分布", "type": "seasonal_grid"}, {"id": "I-REG-03", "name": "非美铜库存分布", "type": "mixed_grid"}, {"id": "I-REG-04", "name": "COMEX / LME 库存走势预测", "type": "seasonal_grid"}]}]}, {"id": "spread", "name": "价差", "subs": [{"name": "价差", "groups": [{"id": "P-SPREAD-01", "name": "基差月差", "type": "seasonal_grid"}, {"id": "P-SPREAD-02", "name": "跨市价差", "type": "seasonal_grid"}, {"id": "P-SPREAD-03", "name": "Premium", "type": "line_grid"}]}]}, {"id": "position", "name": "持仓", "subs": [{"name": "持仓", "groups": [{"id": "P-POSITION-01", "name": "总持仓（手）", "type": "seasonal_grid"}, {"id": "P-POSITION-02", "name": "总持仓（万吨）", "type": "seasonal_grid"}, {"id": "P-POSITION-03", "name": "基金持仓", "type": "mixed_grid"}, {"id": "P-POSITION-04", "name": "交割仓单与虚实比", "type": "seasonal_grid"}]}]}, {"id": "trade", "name": "进出口", "subs": [{"name": "中国", "groups": [{"id": "T-CN-00", "name": "进出口汇总", "type": "seasonal_grid"}, {"id": "T-CN-01", "name": "精铜进出口", "type": "seasonal_grid"}, {"id": "T-CN-02", "name": "铜矿进口", "type": "seasonal_grid"}, {"id": "T-CN-03", "name": "废铜进口", "type": "seasonal_grid"}, {"id": "T-CN-04", "name": "阳极铜进口", "type": "seasonal_grid"}, {"id": "T-CN-05", "name": "铜材出口", "type": "seasonal_grid"}]}, {"name": "智利", "groups": [{"id": "T-CL-01", "name": "铜精矿出口", "type": "seasonal_grid"}, {"id": "T-CL-02", "name": "精炼铜出口", "type": "seasonal_grid"}, {"id": "T-CL-03", "name": "硫磺硫酸进出口", "type": "seasonal_grid"}]}, {"name": "印度", "groups": [{"id": "T-IN-01", "name": "铜精矿进出口", "type": "seasonal_grid"}, {"id": "T-IN-03", "name": "精炼铜进出口", "type": "seasonal_grid"}, {"id": "T-IN-02", "name": "废铜进出口", "type": "seasonal_grid"}]}, {"name": "土耳其", "groups": [{"id": "T-TR-01", "name": "精炼铜进出口", "type": "seasonal_grid"}]}, {"name": "日本", "groups": [{"id": "T-JP-01", "name": "铜精矿进出口", "type": "seasonal_grid"}, {"id": "T-JP-02", "name": "精炼铜进出口", "type": "seasonal_grid"}, {"id": "T-JP-03", "name": "废铜进出口", "type": "seasonal_grid"}]}, {"name": "韩国", "groups": [{"id": "T-KR-01", "name": "铜精矿进出口", "type": "seasonal_grid"}, {"id": "T-KR-02", "name": "精炼铜进出口", "type": "seasonal_grid"}, {"id": "T-KR-03", "name": "废铜进出口", "type": "seasonal_grid"}]}, {"name": "欧盟", "groups": [{"id": "T-EU-01", "name": "铜精矿进出口", "type": "seasonal_grid"}, {"id": "T-EU-03", "name": "精炼铜进出口", "type": "seasonal_grid"}, {"id": "T-EU-02", "name": "废铜进出口", "type": "seasonal_grid"}]}, {"name": "美国", "groups": [{"id": "T-US-01", "name": "美国精铜进口", "type": "seasonal_grid"}, {"id": "T-US-03", "name": "铜精矿进出口", "type": "seasonal_grid"}, {"id": "T-US-04", "name": "废铜月度进出口", "type": "seasonal_grid"}, {"id": "T-US-02", "name": "美国废铜周度出口", "type": "seasonal_grid"}]}, {"name": "非洲", "groups": [{"id": "T-AF-01", "name": "非洲精炼铜出口", "type": "seasonal_grid"}]}]}];
const STATE_KEY = 'copperDashboardState';
let currentModule = 0;
let currentSub = 0;
let currentGroup = 0;
let currentGroups = [];
let renderGeneration = 0;
let renderTimer = null;
let resizeTimer = null;
function clampIndex(value, length){
  const n=Number.isInteger(value)?value:parseInt(value,10);
  if(!length){return 0;}
  return Number.isFinite(n)?Math.max(0,Math.min(length-1,n)):0;
}
function loadState(){
  try{
    const state=JSON.parse(localStorage.getItem(STATE_KEY)||'{}');
    return state&&typeof state==='object'&&!Array.isArray(state)?state:{};
  }
  catch(e){return {};}
}
function saveState(){
  try{localStorage.setItem(STATE_KEY,JSON.stringify({module:currentModule,sub:currentSub,group:currentGroup}));}
  catch(e){}
}
function buildNav(){
  const nav=document.getElementById('navBar');
  MODULES.forEach((m,i)=>{const d=document.createElement('button');d.type='button';d.className='nav-item';d.textContent=m.name;d.onclick=()=>selectModule(i,0,0);nav.appendChild(d);});
  if(!MODULES.length){renderChart(null);return;}
  const state=loadState();
  selectModule(clampIndex(state.module,MODULES.length),state.sub,state.group);
}
function selectModule(i,subIndex=0,groupIndex=0){
  currentModule=i;
  document.querySelectorAll('.nav-item').forEach((e,j)=>{e.classList.toggle('active',j===i);e.setAttribute('aria-current',j===i?'page':'false');});
  const m=MODULES[i], sub=document.getElementById('subNav'); sub.innerHTML='';
  const subs=m.subs||[];
  if(subs.length===0){currentSub=0;currentGroup=0;currentGroups=[];renderSidebar([],0);renderChart(null);saveState();return;}
  subs.forEach((s,j)=>{const d=document.createElement('button');d.type='button';d.className='sub-item';d.textContent=s.name;d.onclick=()=>selectSub(j,0);sub.appendChild(d);});
  selectSub(clampIndex(subIndex,subs.length),groupIndex);
}
function selectSub(j,groupIndex=0){
  currentSub=j;
  document.querySelectorAll('.sub-item').forEach((e,k)=>{e.classList.toggle('active',k===j);e.setAttribute('aria-current',k===j?'page':'false');});
  const groups=(MODULES[currentModule].subs[j]||{}).groups||[];
  currentGroups=groups;
  const activeGroup=clampIndex(groupIndex,groups.length);
  renderSidebar(groups,activeGroup);
  if(groups.length){selectGroup(activeGroup, groups);} else {currentGroup=0;renderChart(null);saveState();}
}
function renderSidebar(groups,activeIndex){
  const side=document.getElementById('sidebar'); side.innerHTML='';
  groups.forEach((g,k)=>{const d=document.createElement('button');d.type='button';d.className='side-item'+(k===activeIndex?' active':'');d.textContent=g.name;d.setAttribute('aria-current',k===activeIndex?'page':'false');d.onclick=()=>selectGroup(k, groups);side.appendChild(d);});
}
function selectGroup(k, groups=currentGroups){
  currentGroup=k;
  currentGroups=groups;
  document.querySelectorAll('.side-item').forEach((e,i)=>{e.classList.toggle('active',i===k);e.setAttribute('aria-current',i===k?'page':'false');});
  renderChart(chartData[groups[k].id]);
  saveState();
}
function purgeCharts(wrap){
  if(!window.Plotly||typeof Plotly.purge!=='function'){return;}
  wrap.querySelectorAll('.js-plotly-plot').forEach(node=>Plotly.purge(node));
}
function showChartError(target,generation,error){
  if(generation!==renderGeneration||!target.isConnected){return;}
  if(window.Plotly&&typeof Plotly.purge==='function'){Plotly.purge(target);}
  const message=document.createElement('div');
  message.className='empty';
  message.textContent='图表加载失败';
  target.replaceChildren(message);
  if(error){console.error(error);}
}
function stackChartFooter(target,layout,cellH){
  const annotations=(layout.annotations||[]).map(annotation=>({...annotation}));
  const sourceIndex=annotations.findIndex(annotation=>typeof annotation.text==='string'&&annotation.text.startsWith('数据来源:'));
  const legend=target.querySelector('g.legend');
  const sourceText=[...target.querySelectorAll('text')].find(node=>(node.textContent||'').trim().startsWith('数据来源:'));
  if(sourceIndex<0||!legend||!sourceText){target.dataset.footerReady='true';return Promise.resolve();}
  const legendHeight=Math.ceil(legend.getBoundingClientRect().height);
  const sourceHeight=Math.ceil(sourceText.getBoundingClientRect().height);
  const sourceBottom=8, gap=8;
  const legendTop=sourceBottom+sourceHeight+gap+legendHeight;
  const margin={...(layout.margin||{})};
  margin.b=Math.max(margin.b||0,legendTop+2);
  const plotH=Math.max(1,cellH-(margin.t||0)-margin.b);
  annotations[sourceIndex]={...annotations[sourceIndex],y:(sourceBottom-margin.b)/plotH,yanchor:'bottom'};
  return Plotly.relayout(target,{
    'margin.b':margin.b,
    'legend.y':(legendTop-margin.b)/plotH,
    'legend.yanchor':'top',
    annotations,
  }).then(()=>{target.dataset.footerReady='true';});
}
function enablePointerDrag(scroller){
  let drag=null;
  scroller.addEventListener('pointerdown',event=>{
    if(event.pointerType!=='mouse'||event.button!==0||scroller.scrollWidth<=scroller.clientWidth){return;}
    drag={id:event.pointerId,x:event.clientX,left:scroller.scrollLeft,moved:false};
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener('pointermove',event=>{
    if(!drag||drag.id!==event.pointerId){return;}
    const dx=event.clientX-drag.x;
    if(!drag.moved&&Math.abs(dx)<4){return;}
    drag.moved=true;
    scroller.classList.add('is-dragging');
    scroller.scrollLeft=drag.left-dx;
    event.preventDefault();
  });
  const endDrag=event=>{
    if(!drag||drag.id!==event.pointerId){return;}
    if(scroller.hasPointerCapture(event.pointerId)){scroller.releasePointerCapture(event.pointerId);}
    drag=null;
    scroller.classList.remove('is-dragging');
  };
  scroller.addEventListener('pointerup',endDrag);
  scroller.addEventListener('pointercancel',endDrag);
}
function renderDataTable(wrap,cfg){
  if(!cfg.rows||!cfg.rows.length){return;}
  const shell=document.createElement('section');
  shell.className='data-table-shell';
  shell.setAttribute('aria-label','国内月度平衡表');
  const meta=document.createElement('div');
  meta.className='data-table-meta';
  const year=document.createElement('span');
  year.className='data-table-year';
  year.textContent=String(cfg.year)+'年';
  meta.appendChild(year);
  if(cfg.source){
    const source=document.createElement('span');
    source.className='data-table-source';
    source.textContent='数据来源: '+cfg.source;
    meta.appendChild(source);
  }
  shell.appendChild(meta);
  const scroller=document.createElement('div');
  scroller.className='data-table-scroll is-draggable';
  scroller.tabIndex=0;
  scroller.setAttribute('role','region');
  scroller.setAttribute('aria-label',String(cfg.year)+'年国内月度平衡表');
  const table=document.createElement('table');
  table.className='monthly-balance-table';
  const colgroup=document.createElement('colgroup');
  (cfg.headers||[]).forEach((_,index)=>{
    const col=document.createElement('col');
    col.className=index===0?'metric-col':'month-col';
    colgroup.appendChild(col);
  });
  table.appendChild(colgroup);
  const thead=document.createElement('thead');
  const headerRow=document.createElement('tr');
  (cfg.headers||[]).forEach(text=>{
    const th=document.createElement('th');
    th.scope='col';
    th.textContent=text;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);
  const tbody=document.createElement('tbody');
  cfg.rows.forEach(row=>{
    const tr=document.createElement('tr');
    const metric=document.createElement('th');
    metric.scope='row';
    const label=document.createElement('span');
    label.className='metric-main';
    label.textContent=row.label;
    metric.appendChild(label);
    if(row.unit){
      const unit=document.createElement('span');
      unit.className='metric-unit';
      unit.textContent=row.unit;
      metric.appendChild(unit);
    }
    tr.appendChild(metric);
    (row.values||[]).forEach(value=>{
      const td=document.createElement('td');
      if(value===null||value===undefined||value===''){
        td.className='balance-empty';
        td.textContent='--';
      }else{td.textContent=String(value);}
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroller.appendChild(table);
  shell.appendChild(scroller);
  wrap.appendChild(shell);
  enablePointerDrag(scroller);
}
function renderChart(cfg){
  const generation=++renderGeneration;
  if(renderTimer!==null){clearTimeout(renderTimer);renderTimer=null;}
  const wrap=document.getElementById('chartWrap');
  purgeCharts(wrap);
  wrap.replaceChildren();
  if(!cfg){wrap.innerHTML='<div class="empty">该模块图表待确认</div>';return;}
  if(cfg.type==='data_table'){renderDataTable(wrap,cfg);return;}
  let charts=[];
  if(cfg.charts){charts=cfg.charts.filter(c=>c&&c.data&&c.data.length);}
  else if(cfg.data){charts=[cfg];}
  if(!charts.length){wrap.innerHTML='<div class="empty">该图组暂无可用数据</div>';return;}
  const content=document.getElementById('contentWrap'), rect=content.getBoundingClientRect(), style=getComputedStyle(content);
  const cw=Math.max(1,Math.floor(rect.width-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)));
  const ch=Math.max(1,Math.floor(rect.height-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)));
  const cols=cw<720?1:(cw<1120?2:3), visibleRows=2;
  const gap=8, gridPad=4, cellW=Math.max(1,Math.floor((cw-gridPad-gap*(cols-1))/cols));
  const halfHeight=Math.max(1,Math.floor((ch-gap*(visibleRows-1))/visibleRows));
  const cellH=cols===1?halfHeight:Math.max(260,halfHeight);
  const grid=document.createElement('div');
  grid.className='chart-grid';
  grid.style.cssText='display:grid;grid-template-columns:repeat('+cols+','+cellW+'px);gap:'+gap+'px;width:'+cw+'px;max-height:'+ch+'px;padding-right:'+gridPad+'px;';
  const cells=charts.map((_,i)=>{const c=document.createElement('div');c.id='chart_'+generation+'_'+i;c.className='chart-cell';c.style.cssText='width:'+cellW+'px;height:'+cellH+'px;';grid.appendChild(c);return c;});
  wrap.appendChild(grid);
  renderTimer=setTimeout(()=>{
    renderTimer=null;
    if(generation!==renderGeneration){return;}
    charts.forEach((c,i)=>{
    const target=cells[i];
    if(!target||!target.isConnected||target.parentNode!==grid){return;}
    const lo=JSON.parse(JSON.stringify(c.layout||{}));
    lo.width=cellW;
    lo.height=cellH;
    if(cols===1){
      const requestedBottom=Number(lo.meta&&lo.meta.mobileBottomMargin);
      const mobileBottom=Number.isFinite(requestedBottom)?Math.max(84,requestedBottom):84;
      const margin=lo.margin={...(lo.margin||{}),t:34,b:mobileBottom};
      const plotH=Math.max(1,cellH-(margin.t||0)-(margin.b||0));
      lo.font={...(lo.font||{}),size:9};
      if(lo.title&&typeof lo.title==='object')lo.title.font={...(lo.title.font||{}),size:12};
      if(lo.xaxis)lo.xaxis.tickfont={...(lo.xaxis.tickfont||{}),size:9};
      if(lo.yaxis)lo.yaxis.tickfont={...(lo.yaxis.tickfont||{}),size:9};
      if(lo.yaxis2)lo.yaxis2.tickfont={...(lo.yaxis2.tickfont||{}),size:9};
      if(lo.legend){
        lo.legend.font={...(lo.legend.font||{}),size:9};
        lo.legend.y=(60-(margin.b||0))/plotH;
        lo.legend.yanchor='top';
      }
      (lo.annotations||[]).forEach(a=>{
        a.font={...(a.font||{}),size:8};
        if(typeof a.text==='string'&&a.text.startsWith('数据来源:')){
          a.y=(8-(margin.b||0))/plotH;
          a.yanchor='bottom';
        }
      });
    }
    if(!window.Plotly||typeof Plotly.newPlot!=='function'){
      showChartError(target,generation,new Error('Plotly 未加载'));
      return;
    }
    try{
      target.dataset.footerReady='false';
      const result=Plotly.newPlot(target,c.data,lo,{displayModeBar:false,responsive:false});
      Promise.resolve(result)
        .then(()=>stackChartFooter(target,lo,cellH))
        .catch(error=>showChartError(target,generation,error));
    }catch(error){showChartError(target,generation,error);}
  });
  },60);
}
window.addEventListener('resize',()=>{
  if(resizeTimer!==null){clearTimeout(resizeTimer);}
  resizeTimer=setTimeout(()=>{
    resizeTimer=null;
    if(currentGroups.length){renderChart(chartData[currentGroups[currentGroup].id]);}else{renderChart(null);}
  },150);
});
const MODULE_DATA_VERSION = "30a1359fcd0a";
const moduleDataPromises = new Map();
let moduleRequestId = 0;
function showModuleStatus(message){
  const wrap=document.getElementById("chartWrap");
  wrap.innerHTML="";
  const status=document.createElement("div");
  status.className="empty";
  status.textContent=message;
  wrap.appendChild(status);
}
async function loadModuleData(moduleIndex){
  const module=MODULES[moduleIndex];
  if(!module){throw new Error("Unknown module index: "+moduleIndex);}
  if(moduleDataPromises.has(module.id)){return moduleDataPromises.get(module.id);}
  const expectedIds=(module.no_sub?module.groups:module.subs.flatMap(sub=>sub.groups)).map(group=>group.id);
  const request=fetch("data/"+module.id+".json?v="+MODULE_DATA_VERSION)
    .then(response=>{if(!response.ok){throw new Error("HTTP "+response.status+" loading "+module.id);}return response.json();})
    .then(payload=>{
      const keys=Object.keys(payload);
      if(keys.length!==expectedIds.length||keys.some(key=>!expectedIds.includes(key))){throw new Error("Module data mismatch: "+module.id);}
      Object.assign(chartData,payload);
      return payload;
    })
    .catch(error=>{moduleDataPromises.delete(module.id);throw error;});
  moduleDataPromises.set(module.id,request);
  return request;
}
const selectLoadedModule=selectModule;
selectModule=async function(i,subIndex=0,groupIndex=0){
  const requestId=++moduleRequestId;
  document.querySelectorAll(".nav-item").forEach((element,index)=>{element.classList.toggle("active",index===i);element.setAttribute("aria-current",index===i?"page":"false");});
  document.getElementById("subNav").innerHTML="";
  document.getElementById("sidebar").innerHTML="";
  showModuleStatus("正在加载数据...");
  try{
    await loadModuleData(i);
    if(requestId!==moduleRequestId){return;}
    selectLoadedModule(i,subIndex,groupIndex);
  }catch(error){
    if(requestId!==moduleRequestId){return;}
    console.error(error);
    showModuleStatus("数据加载失败，请刷新后重试");
  }
};
buildNav();
