<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铜 · 数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
<style>
:root{
  color-scheme:light;
  --canvas:#f2f3f5;
  --surface:#ffffff;
  --surface-muted:#f8f9fa;
  --surface-dark:#111214;
  --surface-dark-raised:#191a1b;
  --ink:#17181a;
  --ink-muted:#62666d;
  --ink-on-dark:#f7f8f8;
  --line:#e1e3e6;
  --line-dark:#2a2c30;
  --accent:#b44932;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box;letter-spacing:0}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif}
button{border:0;background:none;color:inherit;font:inherit;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.topbar{display:flex;min-height:54px;background:var(--surface-dark);border-bottom:1px solid var(--line-dark)}
.header{display:flex;align-items:center;gap:10px;min-width:208px;padding:0 18px;color:var(--ink-on-dark);font-size:16px;font-weight:600;white-space:nowrap}
.brand-mark{width:4px;height:22px;border-radius:2px;background:var(--accent)}
.nav{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-item{position:relative;display:flex;align-items:center;min-width:68px;min-height:53px;padding:0 18px;cursor:pointer;color:#9fa4ad;font-size:14px;font-weight:500;justify-content:center;white-space:nowrap}
.nav-item:hover{color:var(--ink-on-dark);background:var(--surface-dark-raised)}
.nav-item.active{color:var(--ink-on-dark);background:var(--surface-dark-raised)}
.nav-item.active::after{content:'';position:absolute;right:14px;bottom:0;left:14px;height:2px;background:var(--accent)}
.sub-nav{display:flex;align-items:center;gap:4px;min-height:42px;padding:5px 18px;overflow-x:auto;background:var(--surface-muted);border-bottom:1px solid var(--line);scrollbar-width:none}
.sub-nav::-webkit-scrollbar{display:none}
.sub-item{min-height:32px;padding:6px 12px;cursor:pointer;color:var(--ink-muted);font-size:13px;font-weight:500;border:1px solid transparent;border-radius:var(--radius);white-space:nowrap;text-align:center}
.sub-item:hover{color:var(--ink);background:#eef0f2}
.sub-item.active{color:var(--ink);background:var(--surface);border-color:var(--line)}
.main{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:208px;min-width:208px;padding:10px 8px;overflow-y:auto;background:var(--surface-muted);border-right:1px solid var(--line)}
.side-item{display:block;width:100%;min-height:38px;padding:9px 12px;cursor:pointer;color:var(--ink-muted);font-size:13px;border:1px solid transparent;border-radius:var(--radius)}
.side-item:hover{color:var(--ink);background:#eef0f2}
.side-item.active{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 var(--accent)}
.content{flex:1;min-width:0;overflow:hidden;padding:12px}
.chart-wrap{width:100%;height:100%;min-width:0;min-height:0}
.chart-grid{overflow-y:auto;overflow-x:hidden;scrollbar-color:#c5c8ce transparent;scrollbar-width:thin}
.chart-cell{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(17,18,20,.04)}
.data-table-shell{display:flex;flex-direction:column;width:100%;height:100%;min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.data-table-meta{display:flex;align-items:center;flex:0 0 42px;min-width:0;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface-muted)}
.data-table-year{font-size:13px;font-weight:600;color:var(--ink)}
.data-table-source{margin-left:auto;font-size:10px;color:var(--ink-muted);white-space:nowrap}
.data-table-scroll{flex:1;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c5c8ce var(--surface-muted)}
.data-table-scroll.is-draggable{cursor:grab}
.data-table-scroll.is-dragging{cursor:grabbing;user-select:none}
.data-table-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.monthly-balance-table{width:max(100%,1516px);border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--surface)}
.monthly-balance-table col.metric-col{width:220px}
.monthly-balance-table col.month-col{width:108px}
.monthly-balance-table thead th{position:sticky;top:0;z-index:3;height:44px;padding:0 12px;background:var(--surface-dark);color:var(--ink-on-dark);border-right:1px solid #42454b;border-bottom:1px solid #42454b;font-size:11px;font-weight:600;text-align:center;white-space:nowrap}
.monthly-balance-table thead th:first-child{left:0;z-index:5;text-align:left}
.monthly-balance-table tbody th,.monthly-balance-table tbody td{height:46px;padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;line-height:1.35}
.monthly-balance-table tbody th{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;font-weight:400}
.monthly-balance-table tbody td{text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.monthly-balance-table tbody tr:hover th,.monthly-balance-table tbody tr:hover td{background:var(--surface-muted)}
.metric-main{display:block;color:var(--ink);font-size:12px;font-weight:600}
.metric-unit{display:block;margin-top:2px;color:var(--ink-muted);font-size:9px;font-weight:400}
.balance-empty{color:#b2b6bd}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto;padding:0 12px;color:var(--ink-on-dark)}
.icon-button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px;width:30px;height:30px;border-radius:4px;cursor:pointer;color:var(--ink-muted)}
.icon-button:hover{background:#e9ecef;color:var(--ink)}
.top-actions .icon-button{color:#d2d5da}
.top-actions .icon-button:hover{background:#2a2c30;color:#fff}
.icon-button svg{width:16px;height:16px;flex:none}
.icon-button.is-saved{color:var(--accent)}
.icon-button.is-saved svg{fill:currentColor;fill-opacity:.16}
.side-row{position:relative;display:flex;align-items:center}
.side-row .side-item{padding-right:32px}
.side-star{position:absolute;right:3px;opacity:0}
.side-row:hover .side-star,.side-row:focus-within .side-star,.side-star.is-saved{opacity:1}
.content{display:flex;flex-direction:column;gap:8px}
.view-toolbar{display:flex;align-items:center;gap:8px;flex:0 0 30px;min-width:0}
.view-title{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.generated-at{margin-left:auto;color:var(--ink-muted);font-size:10px;white-space:nowrap}
.layout-control{display:flex;flex:none;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.layout-control .icon-button{height:28px}
.layout-control .icon-button[aria-pressed=true]{color:var(--accent);background:#f7ebe7}
.layout-control[hidden]{display:none}
.chart-wrap{flex:1;height:auto;overflow:hidden}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.chart-card.is-highlighted{outline:2px solid var(--accent);outline-offset:-2px}
.chart-head{display:flex;align-items:center;gap:5px;height:30px;padding:0 6px 0 10px;border-bottom:1px solid #f0f1f3;min-width:0}
.chart-date{font-size:11px;line-height:1.3;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chart-date.is-old{color:#946300}
.date-flag{font-size:10px;white-space:nowrap;color:#946300}
.chart-head .icon-button{margin-left:auto;width:26px;height:26px;flex-basis:26px}
.chart-cell{border:0;border-radius:0;box-shadow:none}
dialog{margin:auto;border:1px solid var(--line);border-radius:8px;padding:0;color:var(--ink);background:var(--surface);box-shadow:0 12px 48px #11121433}
dialog::backdrop{background:#11121466}
.search-dialog{width:min(640px,calc(100% - 24px));max-height:calc(100% - 40px)}
.search-top{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.search-top>svg{width:18px;height:18px;color:var(--ink-muted);flex:none}
.search-input{width:100%;min-width:0;border:0;outline:none;font:inherit;font-size:15px;color:var(--ink);background:transparent}
.search-tabs{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.search-tab{font-size:13px;padding:5px 9px;cursor:pointer;border-bottom:2px solid transparent}
.search-tab[aria-selected=true]{border-color:var(--accent);color:var(--accent)}
.result-count{margin-left:auto;font-size:11px;color:var(--ink-muted)}
.search-results{max-height:min(520px,65vh);overflow-y:auto;padding:4px}
.search-result{display:flex;align-items:center;border-bottom:1px solid #f0f1f3}
.result-open{display:block;min-width:0;flex:1;padding:12px;cursor:pointer}
.result-open:hover,.result-open:focus-visible{background:var(--surface-muted)}
.result-name{display:block;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.result-path{display:block;font-size:11px;color:var(--ink-muted);margin-top:4px;overflow-wrap:anywhere}
.search-result>.icon-button{margin-right:6px}
.search-empty{padding:32px;text-align:center;color:var(--ink-muted);font-size:13px}
.zoom-dialog{width:calc(100% - 32px);height:calc(100% - 32px);max-width:1800px;max-height:none;overflow:hidden}
.zoom-bar{display:flex;align-items:center;height:40px;padding:0 10px;border-bottom:1px solid var(--line)}
.zoom-date{min-width:0;flex:1;font-size:12px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoom-body{height:calc(100% - 40px);overflow:auto}
@media (max-width:720px){
  .topbar{min-height:48px}
  .header{min-width:144px;padding:0 12px;font-size:14px}
  .brand-mark{height:18px}
  .nav-item{min-width:58px;min-height:47px;padding:0 12px;font-size:13px}
  .sub-nav{min-height:40px;padding:4px 8px}
  .main{flex-direction:column}
  .sidebar{display:flex;width:100%;min-width:0;min-height:48px;padding:5px 8px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  .side-item{width:auto;min-width:max-content;min-height:38px;padding:9px 12px;text-align:center}
  .side-item.active{box-shadow:inset 0 -3px var(--accent)}
  .content{padding:8px}
  .top-actions{gap:2px;padding:0 5px}
  .top-actions .icon-button{width:28px;flex-basis:28px}
  .header{min-width:132px;padding:0 8px;font-size:13px}
  .view-toolbar{flex-basis:30px;gap:4px}
  .generated-at{display:none}
  .layout-control{margin-left:auto}
  .side-row{flex:none}
  .side-row .side-item{padding-right:32px}
  .side-star{opacity:1}
  .zoom-dialog{width:calc(100% - 12px);height:calc(100% - 16px)}
  .search-results{max-height:60vh}
  .data-table-meta{flex-basis:40px;padding:0 10px}
  .monthly-balance-table{width:1400px}
  .monthly-balance-table col.metric-col{width:184px}
  .monthly-balance-table col.month-col{width:100px}
  .monthly-balance-table thead th,.monthly-balance-table tbody th,.monthly-balance-table tbody td{padding-left:9px;padding-right:9px}
}
</style>
</head>
<body>
<header class="topbar">
  <h1 class="header"><span class="brand-mark" aria-hidden="true"></span>铜 · 数据看板</h1>
  <nav class="nav" id="navBar" aria-label="主模块"></nav>
  <div class="top-actions"><button type="button" class="icon-button" id="searchOpen" aria-label="搜索图表" title="搜索图表"></button><button type="button" class="icon-button" id="favoritesOpen" aria-label="收藏图组" title="收藏图组"></button></div>
</header>
<nav class="sub-nav" id="subNav" aria-label="子模块"></nav>
<div class="main">
  <aside class="sidebar" id="sidebar" aria-label="图表组"></aside>
  <div class="content" id="contentWrap">
    <div class="view-toolbar"><div class="view-title" id="viewTitle"></div><button type="button" id="groupFavorite" class="icon-button" aria-label="收藏当前图组" title="收藏当前图组"></button><time class="generated-at" id="generatedAt"></time><div class="layout-control" role="group" aria-label="图表布局"><button type="button" class="icon-button" id="layoutStandard" aria-label="标准布局" title="标准布局" aria-pressed="true"></button><button type="button" class="icon-button" id="layoutWide" aria-label="宽图布局" title="宽图布局" aria-pressed="false"></button></div></div>
    <div class="chart-wrap" id="chartWrap"></div>
  </div>
</div>
<dialog class="search-dialog" id="searchDialog" aria-label="查找图表">
  <div class="search-top"><input id="chartSearch" class="search-input" type="search" placeholder="搜索图组、指标或来源" aria-label="搜索图组、指标或来源" autocomplete="off"><button type="button" class="icon-button" id="searchClose" aria-label="关闭搜索" title="关闭搜索"></button></div>
  <div class="search-tabs" role="tablist" aria-label="图组范围"><button type="button" class="search-tab" role="tab" id="searchAll" aria-selected="true">全部图组</button><button type="button" class="search-tab" role="tab" id="searchSaved" aria-selected="false">收藏</button><span class="result-count" id="resultCount" aria-live="polite"></span></div>
  <div class="search-results" id="searchResults"></div>
</dialog>
<dialog class="zoom-dialog" id="zoomDialog" aria-label="放大图表"><div class="zoom-bar"><span class="zoom-date" id="zoomDate"></span><button type="button" class="icon-button" id="zoomClose" aria-label="关闭放大图表" title="关闭放大图表"></button></div><div class="zoom-body" id="zoomBody"></div></dialog>
<script>
const chartData = {};

  scroller.addEventListener('pointerdown',event=>{
    if(event.pointerType!=='mouse'||event.button!==0||scroller.scrollWidth<=scroller.clientWidth){return;}
    drag={id:event.pointerId,x:event.clientX,left:scroller.scrollLeft,moved:false};
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener('pointermove',event=>{
    if(!drag||drag.id!==event.pointerId){return;}
    const dx=event.clientX-drag.x;
    if(!drag.moved&&Math.abs(dx)<4){return;}
    drag.moved=true;
    scroller.classList.add('is-dragging');
    scroller.scrollLeft=drag.left-dx;
    event.preventDefault();
  });
  const endDrag=event=>{
    if(!drag||drag.id!==event.pointerId){return;}
    if(scroller.hasPointerCapture(event.pointerId)){scroller.releasePointerCapture(event.pointerId);}
    drag=null;
    scroller.classList.remove('is-dragging');
  };
  scroller.addEventListener('pointerup',endDrag);
  scroller.addEventListener('pointercancel',endDrag);
}
function renderDataTable(wrap,cfg){
  if(!cfg.rows||!cfg.rows.length){return;}
  const shell=document.createElement('section');
  shell.className='data-table-shell';
  shell.setAttribute('aria-label','国内月度平衡表');
  const meta=document.createElement('div');
  meta.className='data-table-meta';
  const year=document.createElement('span');
  year.className='data-table-year';
  year.textContent=String(cfg.year)+'年';
  meta.appendChild(year);
  if(cfg.source){
    const source=document.createElement('span');
    source.className='data-table-source';
    source.textContent='数据来源: '+cfg.source;
    meta.appendChild(source);
  }
  shell.appendChild(meta);
  const scroller=document.createElement('div');
  scroller.className='data-table-scroll is-draggable';
  scroller.tabIndex=0;
  scroller.setAttribute('role','region');
  scroller.setAttribute('aria-label',String(cfg.year)+'年国内月度平衡表');
  const table=document.createElement('table');
  table.className='monthly-balance-table';
  const colgroup=document.createElement('colgroup');
  (cfg.headers||[]).forEach((_,index)=>{
    const col=document.createElement('col');
    col.className=index===0?'metric-col':'month-col';
    colgroup.appendChild(col);
  });
  table.appendChild(colgroup);
  const thead=document.createElement('thead');
  const headerRow=document.createElement('tr');
  (cfg.headers||[]).forEach(text=>{
    const th=document.createElement('th');
    th.scope='col';
    th.textContent=text;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);
  const tbody=document.createElement('tbody');
  cfg.rows.forEach(row=>{
    const tr=document.createElement('tr');
    const metric=document.createElement('th');
    metric.scope='row';
    const label=document.createElement('span');
    label.className='metric-main';
    label.textContent=row.label;
    metric.appendChild(label);
    if(row.unit){
      const unit=document.createElement('span');
      unit.className='metric-unit';
      unit.textContent=row.unit;
      metric.appendChild(unit);
    }
    tr.appendChild(metric);
    (row.values||[]).forEach(value=>{
      const td=document.createElement('td');
      if(value===null||value===undefined||value===''){
        td.className='balance-empty';
        td.textContent='--';
      }else{td.textContent=String(value);}
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroller.appendChild(table);
  shell.appendChild(scroller);
  wrap.appendChild(shell);
  enablePointerDrag(scroller);
}
function renderChart(cfg){
  const generation=++renderGeneration;
  if(renderTimer!==null){clearTimeout(renderTimer);renderTimer=null;}
  const wrap=document.getElementById('chartWrap');
  purgeCharts(wrap);
  wrap.replaceChildren();
  const groupId=Object.keys(chartData).find(id=>chartData[id]===cfg);
  const group=GROUP_INDEX.find(g=>g.id===groupId);
  document.getElementById('viewTitle').textContent=group?.name||'';
  const favorite=document.getElementById('groupFavorite');
  favorite.dataset.favorite=groupId||'';favorite.disabled=!groupId;favorite.onclick=()=>toggleFavorite(groupId);
  syncFavoriteButtons();
  const wide=dashboardState.layouts[groupId]==='wide';
  document.getElementById('layoutStandard').setAttribute('aria-pressed',String(!wide));
  document.getElementById('layoutWide').setAttribute('aria-pressed',String(wide));
  document.querySelector('.layout-control').hidden=cfg?.type==='data_table';
  if(!cfg){wrap.innerHTML='<div class="empty">该模块图表待确认</div>';return;}
  if(cfg.type==='data_table'){renderDataTable(wrap,cfg);return;}
  let charts=[];
  if(cfg.charts){charts=cfg.charts.filter(c=>c&&c.data&&c.data.length);}
  else if(cfg.data){charts=[cfg];}
  if(!charts.length){wrap.innerHTML='<div class="empty">该图组暂无可用数据</div>';return;}
  const rect=wrap.getBoundingClientRect();
  const cw=Math.max(1,Math.floor(rect.width)),ch=Math.max(1,Math.floor(rect.height));
  const cols=cw<720?1:wide?Math.min(2,charts.length):(cw<1120?2:3);
  const visibleRows=wide?Math.min(2,Math.ceil(charts.length/cols)):2;
  const gap=8, gridPad=4, cellW=Math.max(1,Math.floor((cw-gridPad-gap*(cols-1))/cols));
  const halfHeight=Math.max(1,Math.floor((ch-gap*(visibleRows-1))/visibleRows));
  const cellH=cols===1?halfHeight:Math.max(260,halfHeight);
  const grid=document.createElement('div');
  grid.className='chart-grid';
  grid.style.cssText='display:grid;grid-template-columns:repeat('+cols+','+cellW+'px);gap:'+gap+'px;width:'+cw+'px;max-height:'+ch+'px;padding-right:'+gridPad+'px;';
  const cells=charts.map((chart,i)=>{
    const meta=dashboardMeta.groups[groupId]?.[i];
    const card=document.createElement('article');card.className='chart-card';card.style.cssText='width:'+cellW+'px;height:'+cellH+'px;';card.dataset.chartIndex=i;
    const head=document.createElement('div');head.className='chart-head';
    const date=document.createElement('span');date.className='chart-date'+(meta?.longInterval?' is-old':'');date.textContent=dateLabel(meta);date.title=dateDetails(meta);date.tabIndex=0;
    head.appendChild(date);
    const flagText=meta?.forecastThrough&&meta.latest?'含预估':meta?.earliest!==meta?.latest?'日期不齐':'';
    if(flagText){const flag=document.createElement('span');flag.className='date-flag';flag.textContent=flagText;flag.title=dateDetails(meta);head.appendChild(flag);}
    head.appendChild(iconButton('expand','放大：'+chart.layout?.title?.text,()=>openZoom(chart,meta)));
    const c=document.createElement('div');c.id='chart_'+generation+'_'+i;c.className='chart-cell';c.style.cssText='width:'+cellW+'px;height:'+(cellH-30)+'px;';
    card.append(head,c);grid.appendChild(card);return c;
  });
  wrap.appendChild(grid);
  renderTimer=setTimeout(()=>{
    renderTimer=null;
    if(generation!==renderGeneration){return;}
    Promise.all(charts.map((c,i)=>{
    const target=cells[i];
    if(!target||!target.isConnected||target.parentElement.parentElement!==grid){return;}
    return drawPlot(c,target,cellW,cellH-30,()=>generation===renderGeneration);
    })).then(()=>{
      if(generation!==renderGeneration)return;
      grid.dataset.ready='true';
      if(pendingChartIndex?.id===groupId){
        const card=grid.children[pendingChartIndex.index];
        if(card){card.classList.add('is-highlighted');card.scrollIntoView({block:'nearest',inline:'nearest'});}
        pendingChartIndex=null;
      }
    });
  },60);
}
function drawPlot(chart,target,width,height,isCurrent){
  const lo=JSON.parse(JSON.stringify(chart.layout||{}));
  lo.width=width;lo.height=height;
  const mobile=innerWidth<=720;
  if(lo.xaxis?.ticktext?.length===12&&lo.xaxis.ticktext.every(text=>/^\d+月$/.test(text))){
    lo.xaxis.tickangle=0;lo.xaxis.tickfont={...(lo.xaxis.tickfont||{}),size:11};
  }
  if(mobile){
    lo.margin={...(lo.margin||{}),t:34,b:Math.max(84,Number(lo.meta?.mobileBottomMargin)||84)};
    lo.font={...(lo.font||{}),size:9};
    if(lo.title&&typeof lo.title==='object')lo.title.font={...(lo.title.font||{}),size:12};
    ['xaxis','yaxis','yaxis2'].forEach(axis=>{if(lo[axis])lo[axis].tickfont={...(lo[axis].tickfont||{}),size:9};});
    if(lo.legend)lo.legend.font={...(lo.legend.font||{}),size:9};
    (lo.annotations||[]).forEach(a=>{a.font={...(a.font||{}),size:8};});
  }
  // Long titles wrap inside the plot; the source chart and report title stay intact.
  if(lo.title?.text&&!lo.title.text.includes('<br>')){
    const size=lo.title.font?.size||14, limit=Math.max(12,Math.floor((width-28)/size));
    let line='',weight=0;const lines=[];
    for(const char of lo.title.text){const step=char.charCodeAt(0)>255?1:.55;if(weight+step>limit){lines.push(line);line='';weight=0;}line+=char;weight+=step;}
    lines.push(line);lo.title.text=lines.join('<br>');
    if(lines.length>1)lo.margin={...(lo.margin||{}),t:(lo.margin?.t||48)+(lines.length-1)*(size+3)};
  }
  target.dataset.footerReady='false';
  const fail=error=>{
    if(!isCurrent()||!target.isConnected)return;
    if(window.Plotly)Plotly.purge(target);
    target.classList.add('empty');target.textContent='图表加载失败';target.dataset.footerReady='error';console.error(error);
  };
  if(!window.Plotly){fail(new Error('Plotly 未加载'));return Promise.resolve();}
  try{
    return Promise.resolve(Plotly.newPlot(target,JSON.parse(JSON.stringify(chart.data)),lo,{displayModeBar:false,responsive:false}))
      .then(()=>{if(isCurrent()&&target.isConnected)return stackChartFooter(target,lo,height);})
      .catch(fail);
  }catch(error){fail(error);return Promise.resolve();}
}
function renderZoom(){
  const body=document.getElementById('zoomBody'),generation=++zoomGeneration;
  purgeCharts(body);body.replaceChildren();
  const cell=document.createElement('div');cell.className='chart-cell';body.appendChild(cell);
  const width=Math.floor(body.clientWidth),height=Math.floor(body.clientHeight);
  cell.style.cssText='width:'+width+'px;height:'+height+'px;';
  return drawPlot(zoomChart,cell,width,height,()=>generation===zoomGeneration&&document.getElementById('zoomDialog').open);
}
function openZoom(chart,meta){
  zoomChart=chart;zoomViewport=innerWidth+':'+innerHeight;
  document.getElementById('zoomDate').textContent=dateLabel(meta);
  document.getElementById('zoomDate').title=dateDetails(meta);
  const dialog=document.getElementById('zoomDialog');dialog.setAttribute('aria-label',chart.layout?.title?.text||'放大图表');dialog.showModal();
  renderZoom();
}
function setLayout(value){
  const id=currentGroups[currentGroup]?.id;if(!id)return;
  dashboardState.layouts[id]=value;saveState();renderChart(chartData[id]);
}
function setupControls(){
  [['searchOpen','search'],['favoritesOpen','star'],['groupFavorite','star'],['layoutStandard','standard'],['layoutWide','wide'],['searchClose','close'],['zoomClose','close']].forEach(([id,name])=>document.getElementById(id).appendChild(icon(name)));
  document.getElementById('searchOpen').onclick=()=>openSearch();
  document.getElementById('favoritesOpen').onclick=()=>openSearch(true);
  document.getElementById('searchClose').onclick=()=>document.getElementById('searchDialog').close();
  document.getElementById('zoomClose').onclick=()=>document.getElementById('zoomDialog').close();
  document.getElementById('zoomDialog').addEventListener('close',()=>{zoomGeneration++;purgeCharts(document.getElementById('zoomBody'));document.getElementById('zoomBody').replaceChildren();if(zoomViewport!==innerWidth+':'+innerHeight&&currentGroups.length)renderChart(chartData[currentGroups[currentGroup].id]);});
  document.getElementById('chartSearch').oninput=renderSearch;
  document.getElementById('searchAll').onclick=()=>{searchFavorites=false;renderSearch();};
  document.getElementById('searchSaved').onclick=()=>{searchFavorites=true;renderSearch();};
  document.getElementById('searchDialog').addEventListener('keydown',event=>{
    const results=[...document.querySelectorAll('.result-open')],index=results.indexOf(document.activeElement);
    if(event.key==='Escape'){event.preventDefault();document.getElementById('searchDialog').close();return;}
    if(event.key==='ArrowDown'&&results.length){event.preventDefault();results[Math.min(results.length-1,index+1)].focus();}
    if(event.key==='ArrowUp'){event.preventDefault();if(index>0)results[index-1].focus();else document.getElementById('chartSearch').focus();}
    if(event.key==='Enter'&&document.activeElement.id==='chartSearch'&&results.length){event.preventDefault();results[0].click();}
  });
  document.getElementById('layoutStandard').onclick=()=>setLayout('standard');
  document.getElementById('layoutWide').onclick=()=>setLayout('wide');
  const generated=document.getElementById('generatedAt');generated.dateTime=dashboardMeta.generatedAt;generated.textContent='页面生成 '+dashboardMeta.generatedAt.slice(0,16).replace('T',' ');
  const searchTime=generated.cloneNode(true);searchTime.removeAttribute('id');searchTime.className='search-generated';searchTime.style.cssText='display:block;padding:8px 16px;font-size:10px;color:var(--ink-muted);border-top:1px solid var(--line)';document.getElementById('searchDialog').appendChild(searchTime);
}
window.addEventListener('resize',()=>{
  if(resizeTimer!==null){clearTimeout(resizeTimer);}
  resizeTimer=setTimeout(()=>{
    resizeTimer=null;
    if(document.getElementById('zoomDialog').open){renderZoom();}
    else if(currentGroups.length){renderChart(chartData[currentGroups[currentGroup].id]);}else{renderChart(null);}
    revealNavigation();
  },150);
});
setupControls();
const MODULE_DATA_VERSION = "8aca476c6740";
const moduleDataPromises = new Map();
let moduleRequestId = 0;
function showModuleStatus(message){
  const wrap=document.getElementById("chartWrap");
  wrap.innerHTML="";
  const status=document.createElement("div");
  status.className="empty";
  status.textContent=message;
  wrap.appendChild(status);
}
async function loadModuleData(moduleIndex){
  const module=MODULES[moduleIndex];
  if(!module){throw new Error("Unknown module index: "+moduleIndex);}
  if(moduleDataPromises.has(module.id)){return moduleDataPromises.get(module.id);}
  const expectedIds=(module.no_sub?module.groups:module.subs.flatMap(sub=>sub.groups)).map(group=>group.id);
  const request=fetch("data/"+module.id+".json?v="+MODULE_DATA_VERSION)
    .then(response=>{if(!response.ok){throw new Error("HTTP "+response.status+" loading "+module.id);}return response.json();})
    .then(payload=>{
      const keys=Object.keys(payload);
      if(keys.length!==expectedIds.length||keys.some(key=>!expectedIds.includes(key))){throw new Error("Module data mismatch: "+module.id);}
      Object.assign(chartData,payload);
      return payload;
    })
    .catch(error=>{moduleDataPromises.delete(module.id);throw error;});
  moduleDataPromises.set(module.id,request);
  return request;
}
const selectLoadedModule=selectModule;
selectModule=async function(i,subIndex=0,groupIndex=0){
  const requestId=++moduleRequestId;
  document.querySelectorAll(".nav-item").forEach((element,index)=>{element.classList.toggle("active",index===i);element.setAttribute("aria-current",index===i?"page":"false");});
  document.getElementById("subNav").innerHTML="";
  document.getElementById("sidebar").innerHTML="";
  showModuleStatus("正在加载数据...");
  try{
    await loadModuleData(i);
    if(requestId!==moduleRequestId){return;}
    selectLoadedModule(i,subIndex,groupIndex);
  }catch(error){
    if(requestId!==moduleRequestId){return;}
    console.error(error);
    showModuleStatus("数据加载失败，请刷新后重试");
  }
};
